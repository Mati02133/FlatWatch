name: Probe OLX

# Workflow diagnostyczny czy olx wpuszcza runnera

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalacja zaleznosci
        run: pip install -r backend/requirements.txt

      - name: Czy OLX wpuszcza runnera
        run: |
          python - <<'PY'
          import requests
          from backend.scrapers.olx import fetch_offers

          print("Test 1: zwykly requests na strone glowna OLX ")
          try:
              r = requests.get(
                  "https://www.olx.pl/",
                  headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"},
                  timeout=15,
              )
              print("status HTTP:", r.status_code)
          except Exception as e:
              print("blad polaczenia:", e)

          print()
          print(" Test 2: pelna sciezka przez kod aplikacji")
          try:
              offers = fetch_offers()
              print("surowych ofert z API:", len(offers))
          except Exception as e:
              offers = []
              print("pobieranie nie powiodlo sie:", type(e).__name__, e)

          print()
          if offers:
              print("WYNIK: OLX wpuszcza runnera")
          else:
              print("WYNIK: zero ofert")
              raise SystemExit(1)
          PY
